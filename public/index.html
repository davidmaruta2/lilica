<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lilica</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;

      align-items: center;
      justify-content: center;
      background: #F7F3EF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #241D1C;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(36, 29, 28, 0.08);
      text-align: center;
    }
    h1 { font-size: 24px; margin: 0 0 12px; color: #63364D; }
    p { font-size: 15px; line-height: 22px; color: #6B615C; margin: 0; }
    .links { margin-top: 20px; display: flex; gap: 16px; justify-content: center; }
    .links a { color: #63364D; font-size: 13px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Lilica</h1>
    <p>A calm care organiser for families. If you've received a Care Circle invitation link, open that link directly.</p>
    <div class="links">
      <a href="/privacy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
